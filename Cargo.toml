[workspace]
resolver = "2"
members = ["core", "app", "sync"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex-lite = "0.1"
lz-str = "0.2"
miniz_oxide = "0.9"
base64 = "0.23"
scraper = "0.27"

# Small wasm binary: aggressive size optimization. `panic = "abort"` still runs
# the panic hook (console_error_panic_hook) before trapping.
[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
