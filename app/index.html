<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Plan your CMI semester timetable. Everything is saved in your browser." />
  <title>CMI Timetable Planner</title>
  <!-- The tab icon is the app's own mark (see `ui::logo`): the brand gradient,
       a week frame, and one class placed on it. Simplified to a 2x2 ruling
       because at 16 px the header mark's 3x3 closes up into a smudge. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233f5bd9'/%3E%3Cstop offset='1' stop-color='%238a46c8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='16' height='16' rx='3.6' fill='url(%23g)'/%3E%3Crect x='3.5' y='3.5' width='9' height='9' rx='1.6' fill='none' stroke='%23fff' stroke-width='1.1' opacity='.9'/%3E%3Cpath d='M8 3.9v8.2M3.9 8h8.2' stroke='%23fff' stroke-width='.9' opacity='.5'/%3E%3Crect x='8.45' y='8.45' width='3.6' height='3.6' rx='.9' fill='%23fff'/%3E%3C/svg%3E" />
  <script>
    // Set the theme before first paint to avoid a flash. The app keeps
    // document.documentElement.dataset.theme in sync afterwards.
    (function () {
      var theme = "auto";
      try {
        var prefs = JSON.parse(localStorage.getItem("cmitt.v1.prefs") || "{}");
        if (prefs && prefs.theme) theme = prefs.theme;
      } catch (e) { /* corrupt prefs are handled by the app */ }
      // serde stores the variant capitalized ("Dark"); CSS keys off lowercase.
      theme = String(theme).toLowerCase();
      if (theme !== "light" && theme !== "dark") {
        theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <script>
    // Offline copy: a service worker (written by app/hooks/gen-sw.sh at
    // build time) precaches this exact build, so the app opens with no
    // connection after one normal visit. Registered on window load so it
    // never competes with the wasm download. The relative URL keeps this
    // working at "/" (local, e2e, user/org Pages) and "/cmi-timetable/"
    // (project Pages) alike — the scope defaults to the app's own directory.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js").catch(function () {
          // Private windows / old browsers: no offline copy. The app itself
          // is unaffected.
        });
      });
    }
  </script>
  <link data-trunk rel="css" href="styles.css" />
  <link data-trunk rel="copy-file" href="public/404.html" />
  <!-- The --enable-* flags match the wasm features rustc emits by default
       (bulk memory, sign-ext, etc.); older wasm-opt builds reject the module
       without them. -->
  <link data-trunk rel="rust" data-bin="cmi-timetable-app" data-wasm-opt="z"
        data-wasm-opt-params="--enable-bulk-memory --enable-sign-ext --enable-mutable-globals --enable-nontrapping-float-to-int --enable-reference-types --enable-multivalue" />
</head>
<body></body>
</html>
