# Auto-heal transient GitHub Actions infrastructure failures ("Service
# Unavailable" while resolving actions at Set up job, runner outages, …).
# When a CI, deploy or sync run fails, retry its failed jobs ONCE — the
# run_attempt guard stops the loop, so a genuinely broken build still fails
# (and still emails) on the second attempt.

name: Retry transient failures

on:
  workflow_run:
    workflows: ["CI", "Deploy to GitHub Pages", "Sync CMI data mirror"]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 2
    runs-on: ubuntu-latest
    steps:
      - name: Rerun failed jobs (attempt 2)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run rerun ${{ github.event.workflow_run.id }} \
            --failed --repo ${{ github.repository }}
