# Optional but recommended: refresh the same-origin data mirror (§2.3 tier 3)
# every six hours. The app works without this workflow — it falls back to
# direct/proxy fetching — but the mirror is the most reliable tier.
#
# The /sync binary fetches both CMI pages natively (no CORS server-side),
# runs the SAME parser and validation gate as the app, and exits non-zero on
# any failure — a red run means the last good mirror stayed in place.
#
# When the mirror changes, the fresh data files are copied straight onto the
# gh-pages branch (the deployed site) — no wasm rebuild needed, and the next
# local ./deploy.sh (which builds from main) carries them anyway.

name: Sync CMI data mirror

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Fetch, parse and gate
        run: cargo run --release -p cmi-timetable-sync -- app/public/data

      - name: Commit the mirror if it changed
        id: commit
        run: |
          git add app/public/data
          if git diff --cached --quiet; then
            echo "mirror unchanged — skipping commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git -c user.name="cmi-timetable-sync" \
                -c user.email="actions@users.noreply.github.com" \
                commit -m "data: refresh CMI mirror"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # Copy main's mirror onto the deployed site (gh-pages branch) directly — a
  # pure git operation, no build. This runs on EVERY sync, not just when the
  # data changed: local deploys replace gh-pages wholesale, so an older
  # checkout can roll the site's data back, and this is what heals it.
  publish-data:
    needs: sync
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Serialize against the deploy workflow: both write gh-pages.
    concurrency:
      group: pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Refresh data/ on the gh-pages branch
        run: |
          # Only a genuinely missing branch is a reason to skip quietly; any
          # other git failure must fail the job so retry.yml can heal it.
          if ! git ls-remote --exit-code origin refs/heads/gh-pages >/dev/null; then
            echo "no gh-pages branch yet (nothing deployed) — skipping"
            exit 0
          fi
          git fetch origin gh-pages
          git worktree add ../pages FETCH_HEAD
          rm -rf ../pages/data
          cp -r app/public/data ../pages/data
          cd ../pages
          git add -A data
          if git diff --cached --quiet; then
            echo "site data already current"
            exit 0
          fi
          git -c user.name="cmi-timetable-sync" \
              -c user.email="actions@users.noreply.github.com" \
              commit -qm "data: refresh CMI mirror (site)"
          git push origin HEAD:gh-pages
