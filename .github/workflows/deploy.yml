# MANUAL fallback deploy. Deploys normally happen locally via ./deploy.sh
# (build in Docker → force-push the gh-pages branch), which keeps
# GitHub-hosted runners out of the deploy path entirely. Dispatch this
# workflow only when a deploy is needed and no dev machine is available —
# it builds the exact same way and pushes the same branch.

name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  TRUNK_VERSION: v0.21.14

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Rust (with the wasm target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install Trunk
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xzf- -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run tests
        run: cargo test --workspace

      - name: Build (project-pages public URL)
        # For a user/organization page (<user>.github.io repo), change the
        # public URL to "/".
        working-directory: app
        run: trunk build --release --public-url "/${{ github.event.repository.name }}/"

      - name: Publish as a single orphan commit on gh-pages
        run: |
          touch app/dist/.nojekyll
          cd app/dist
          git init -q -b gh-pages
          git add -A
          git -c user.name="deploy" -c user.email="actions@users.noreply.github.com" \
              commit -qm "deploy: ${GITHUB_SHA::7} (remote dispatch)"
          git push --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            gh-pages:gh-pages
